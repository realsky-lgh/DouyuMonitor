name: Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-websockets-dev \
            libqt6quicktemplates2-6 \
            libqt6quickcontrols2-6 \
            qml6-module-qtquick-controls \
            libmpv-dev \
            python3-pip \
            python3-pil \
            dpkg-dev

      - name: Configure CMake
        run: |
          cmake -B native/out/build/linux-x64-release -S native -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build native/out/build/linux-x64-release --target douyu_monitor_native

      - name: Setup StreamGet Service
        run: |
          pip3 install --break-system-packages pyinstaller
          pip3 install --break-system-packages -r native/service/requirements.txt
          pyinstaller --noconfirm --onedir --name streamget_service native/service/streamget_service.py --distpath native/out/build/linux-x64-release

      - name: Package Linux release
        run: |
          bash native/scripts/build-linux-packages.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/packages/*.deb
            out/packages/*.tar.gz
            out/packages/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
