name: Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build-windows:
    name: Build Windows 11 Installer
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -r native/service/requirements.txt

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6.7.3
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebsockets qtshadertools'
          cache: true

      - name: Setup libmpv
        shell: pwsh
        run: |
          $mpvDir = "$pwd\native\sdk\mpv"
          New-Item -ItemType Directory -Force -Path $mpvDir | Out-Null
          $archive = "$pwd\native\sdk\mpv.7z"
          $mpvUrl = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z"
          Write-Host "Downloading libmpv from $mpvUrl ..."
          Invoke-WebRequest -Uri $mpvUrl -OutFile $archive -MaximumRedirection 5
          7z x $archive "-o$mpvDir" -y
          
          # Ensure libmpv-2.dll is at root of mpvDir
          $dll = Get-ChildItem -Path $mpvDir -Filter "libmpv-2.dll" -Recurse | Select-Object -First 1
          if ($dll -and $dll.DirectoryName -ne $mpvDir) {
            Copy-Item $dll.FullName $mpvDir -Force
          }
          if (-not (Test-Path "$mpvDir\libmpv-2.dll")) {
            throw "libmpv-2.dll not found in $mpvDir"
          }

          # Ensure include/mpv/client.h exists
          $clientH = Get-ChildItem -Path $mpvDir -Filter "client.h" -Recurse | Select-Object -First 1
          if ($clientH) {
            Write-Host "Found client.h at: $($clientH.FullName)"
            $mpvIncludeDir = "$mpvDir\include\mpv"
            if (-not (Test-Path "$mpvIncludeDir\client.h")) {
              New-Item -ItemType Directory -Force -Path $mpvIncludeDir | Out-Null
              Copy-Item "$($clientH.DirectoryName)\*" $mpvIncludeDir -Recurse -Force
            }
          } else {
            throw "client.h not found in libmpv archive"
          }

          # Generate mpv.lib if not present
          if (-not (Test-Path "$mpvDir\mpv.lib")) {
            Write-Host "Generating mpv.lib from libmpv-2.dll ..."
            $def = "$mpvDir\libmpv.def"
            $runtime = "$mpvDir\libmpv-2.dll"
            $exports = & dumpbin /exports $runtime | ForEach-Object {
              if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)\s*$') { $matches[1] }
            } | Where-Object { $_ -like 'mpv_*' }
            $defLines = [System.Collections.Generic.List[string]]::new()
            $defLines.Add('LIBRARY mpv.dll')
            $defLines.Add('EXPORTS')
            foreach ($exp in $exports) { $defLines.Add("  $exp") }
            $defLines | Set-Content -LiteralPath $def -Encoding ascii
            & lib /nologo /machine:x64 /def:$def /out:"$mpvDir\mpv.lib"
          }
          New-Item -ItemType Directory -Force -Path "$mpvDir\lib" | Out-Null
          Copy-Item "$mpvDir\mpv.lib" "$mpvDir\lib\mpv.lib" -Force
          Copy-Item "$mpvDir\libmpv-2.dll" "$mpvDir\mpv.dll" -Force
          Write-Host "libmpv ready in $mpvDir"

      - name: Build StreamGet service
        shell: pwsh
        run: |
          $repoRoot = $pwd.Path
          $nativeRoot = "$repoRoot\native"
          $distPath = "$nativeRoot\out\service"
          $workPath = "$nativeRoot\out\pyinstaller"
          New-Item -ItemType Directory -Force -Path $distPath, $workPath | Out-Null
          pyinstaller --noconfirm --clean --onedir --log-level WARN --name streamget_service `
            --paths $repoRoot --distpath $distPath --workpath $workPath --specpath $workPath `
            --add-data "$nativeRoot\app\resources\hamster_agent_roster.json;native/app/resources" `
            "$nativeRoot\service\streamget_service.py"
          if (-not (Test-Path "$distPath\streamget_service\streamget_service.exe")) {
            throw "streamget_service.exe was not created."
          }

      - name: Configure and Build Native Windows App
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $qtRoot = if ($env:QT_ROOT_DIR -and (Test-Path $env:QT_ROOT_DIR)) {
            $env:QT_ROOT_DIR
          } elseif ($env:QT_ROOT -and (Test-Path $env:QT_ROOT)) {
            $env:QT_ROOT
          } else {
            "${{ steps.install-qt.outputs.qt-root-dir }}"
          }
          $qtRoot = $qtRoot.TrimEnd('\/').Replace('\', '/')
          $mpvRoot = ("$pwd/native/sdk/mpv").Replace('\', '/')
          Write-Host "Using QT_ROOT: $qtRoot"
          Write-Host "Using MPV_ROOT: $mpvRoot"
          $env:QT_ROOT = $qtRoot
          $env:MPV_ROOT = $mpvRoot
          $env:PATH = "$qtRoot/bin;$env:PATH"

          Write-Host "Running CMake configure..."
          $configOutput = & cmake -B native/out/build/windows-x64-release -S native -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DQT_ROOT=$qtRoot" `
            "-DCMAKE_PREFIX_PATH=$qtRoot" `
            "-DMPV_ROOT=$mpvRoot" 2>&1
          $configCode = $LASTEXITCODE
          Write-Host ($configOutput -join "`n")
          if ($configCode -ne 0) {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B ci-debug-logs
            $configOutput | Out-File -FilePath "build_error.log" -Encoding utf8
            git add -f build_error.log
            git commit -m "ci: capture cmake configure error log"
            git push -f origin ci-debug-logs
            throw "CMake configure failed with exit code $configCode"
          }

          Write-Host "Running CMake build..."
          $buildOutput = & cmake --build native/out/build/windows-x64-release --target douyu_monitor_native -v 2>&1
          $buildCode = $LASTEXITCODE
          Write-Host ($buildOutput -join "`n")
          if ($buildCode -ne 0) {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B ci-debug-logs
            $buildOutput | Out-File -FilePath "build_error.log" -Encoding utf8
            git add -f build_error.log
            git commit -m "ci: capture cmake build error log"
            git push -f origin ci-debug-logs
            throw "CMake build failed with exit code $buildCode"
          }

          # Ensure Qt runtime dependencies required by installer script are present
          $releaseDir = "native/out/build/windows-x64-release"
          Get-ChildItem -Path "$qtRoot/bin" -Filter "*.dll" | ForEach-Object {
            $dest = Join-Path $releaseDir $_.Name
            if (-not (Test-Path $dest)) {
              Copy-Item $_.FullName $dest -Force
            }
          }
          $platformDest = Join-Path $releaseDir "platforms"
          New-Item -ItemType Directory -Force -Path $platformDest | Out-Null
          if (-not (Test-Path (Join-Path $platformDest "qwindows.dll"))) {
            Copy-Item "$qtRoot/plugins/platforms/qwindows.dll" $platformDest -Force
          }
          $qmlDest = Join-Path $releaseDir "qml"
          if (-not (Test-Path $qmlDest)) {
            Copy-Item "$qtRoot/qml" $qmlDest -Recurse -Force
          }
          $basicButton = Join-Path $releaseDir "qml/QtQuick/Controls/Basic/Button.qml"
          if (-not (Test-Path $basicButton)) {
            Write-Host "Ensuring QtQuick Controls Basic style is copied..."
            Copy-Item "$qtRoot/qml/QtQuick" (Join-Path $releaseDir "qml") -Recurse -Force
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - name: Build Windows Installer
        shell: pwsh
        run: |
          powershell.exe -ExecutionPolicy Bypass -File .\native\scripts\build-windows-installer.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "build-windows-installer.ps1 failed with exit code $LASTEXITCODE"
          }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-failure-logs
          path: |
            build.log
            build_err.log
          if-no-files-found: ignore

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: native/out/installer/DouyuMonitor-Setup-*.exe

  release:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: [build-windows]
    if: success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Installer Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-installer
          path: native/out/installer/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/packages/douyu-monitor_*.deb
            out/packages/DouyuMonitor-*-linux-x64.tar.gz
            out/packages/SHA256SUMS.txt
            native/out/installer/DouyuMonitor-Setup-*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
